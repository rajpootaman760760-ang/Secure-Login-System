{% extends "accounts/base.html" %}
{% block title %}Verify 2FA — Secure Login System{% endblock %}
{% block content %}
  <div class="lock-icon">🔒</div>
  <h1>Two-Factor Authentication</h1>
  <p class="subtitle">Enter the 6-digit code from your authenticator app</p>

  <form method="post" novalidate>
    {% csrf_token %}
    <label for="{{ form.code.id_for_label }}">Authentication Code</label>
    {{ form.code }}
    {{ form.code.errors }}

    <button type="submit" class="btn">Verify &amp; Log In</button>
  </form>

  <p class="footer-link"><a href="{% url 'login' %}">Cancel and go back</a></p>
{% endblock %}
